
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje współrzędne GPS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            background: #0b1120;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 28px;
            background: #111827;
            border: 1px solid #263449;
            border-radius: 20px;
            box-shadow: 0 20px 60px #0005;
        }

        h1 {
            margin-top: 0;
            font-size: clamp(25px, 5vw, 38px);
        }

        .subtitle {
            color: #aab7ca;
            line-height: 1.6;
        }

        .panel {
            margin-top: 22px;
            padding: 22px;
            background: #0d1525;
            border: 1px solid #263449;
            border-radius: 14px;
        }

        .field {
            display: block;
            margin-bottom: 18px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #b8c5d9;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #34445c;
            border-radius: 9px;
            background: #172337;
            color: #60a5fa;
            font-size: 20px;
            font-weight: bold;
        }

        input:focus {
            outline: 2px solid #3b82f6;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .detail {
            padding: 16px;
            border-radius: 10px;
            background: #172337;
        }

        .detail span {
            display: block;
            margin-bottom: 8px;
            color: #aab7ca;
            font-size: 13px;
        }

        .detail strong {
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: 14px 18px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button.stop {
            background: #374151;
        }

        button.stop:hover {
            background: #4b5563;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #172337;
            color: #cbd5e1;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #status.active {
            color: #4ade80;
        }

        #status.error {
            color: #fca5a5;
        }

        .map-link {
            display: inline-block;
            margin-top: 18px;
            color: #60a5fa;
            text-decoration: none;
        }

        .map-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }

            .container {
                padding: 18px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>📍 Moje współrzędne GPS</h1>

        <p class="subtitle">
            Aplikacja śledzi położenie urządzenia i aktualizuje
            współrzędne automatycznie podczas przemieszczania się.
        </p>

        <section class="panel">
            <div class="field">
                <label for="latitude">Szerokość geograficzna</label>
                <input id="latitude" type="text"
                       placeholder="Oczekiwanie na lokalizację..."
                       readonly>
            </div>

            <div class="field">
                <label for="longitude">Długość geograficzna</label>
                <input id="longitude" type="text"
                       placeholder="Oczekiwanie na lokalizację..."
                       readonly>
            </div>
        </section>

        <section class="panel details">
            <div class="detail">
                <span>Dokładność lokalizacji</span>
                <strong id="accuracy">—</strong>
            </div>

            <div class="detail">
                <span>Wysokość nad poziomem morza</span>
                <strong id="altitude">—</strong>
            </div>

            <div class="detail">
                <span>Prędkość</span>
                <strong id="speed">—</strong>
            </div>

            <div class="detail">
                <span>Ostatnia aktualizacja</span>
                <strong id="updated">—</strong>
            </div>
        </section>

        <div class="buttons">
            <button id="start">▶ Rozpocznij śledzenie</button>
            <button id="stop" class="stop" disabled>
                ■ Zatrzymaj śledzenie
            </button>
        </div>

        <div id="status" role="status" aria-live="polite">
            Śledzenie lokalizacji jest wyłączone.
        </div>

        <a id="mapLink" class="map-link"
           href="#" target="_blank" rel="noopener"
           hidden>
            Otwórz aktualną pozycję na mapie ↗
        </a>
    </main>

    <script>
        const latitude = document.getElementById("latitude");
        const longitude = document.getElementById("longitude");
        const accuracy = document.getElementById("accuracy");
        const altitude = document.getElementById("altitude");
        const speed = document.getElementById("speed");
        const updated = document.getElementById("updated");
        const status = document.getElementById("status");
        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");
        const mapLink = document.getElementById("mapLink");

        let watchId = null;

        function setStatus(message, type = "") {
            status.textContent = message;
            status.className = type;
        }

        function showPosition(position) {
            const coords = position.coords;
            const lat = coords.latitude;
            const lon = coords.longitude;

            latitude.value = lat.toFixed(6) + "°";
            longitude.value = lon.toFixed(6) + "°";

            accuracy.textContent =
                "± " + Math.round(coords.accuracy) + " m";

            altitude.textContent =
                coords.altitude === null
                    ? "Brak danych"
                    : coords.altitude.toFixed(1) + " m";

            speed.textContent =
                coords.speed === null
                    ? "Brak danych"
                    : (coords.speed * 3.6).toFixed(1) + " km/h";

            updated.textContent =
                new Date(position.timestamp).toLocaleTimeString("pl-PL");

            mapLink.href =
                "https://www.openstreetmap.org/?mlat=" +
                encodeURIComponent(lat) +
                "&mlon=" + encodeURIComponent(lon) +
                "#map=17/" + lat + "/" + lon;

            mapLink.hidden = false;

            setStatus(
                "● Śledzenie aktywne. Współrzędne są aktualizowane " +
                "przez przeglądarkę.",
                "active"
            );
        }

        function showError(error) {
            const messages = {
                1: "Nie udzielono zgody na dostęp do lokalizacji.",
                2: "Nie udało się ustalić położenia urządzenia.",
                3: "Przekroczono czas oczekiwania na lokalizację."
            };

            setStatus(
                messages[error.code] || "Wystąpił błąd lokalizacji.",
                "error"
            );
        }

        function startTracking() {
            if (!("geolocation" in navigator)) {
                setStatus(
                    "Ta przeglądarka nie obsługuje geolokalizacji.",
                    "error"
                );
                return;
            }

            if (!window.isSecureContext) {
                setStatus(
                    "Otwórz aplikację przez HTTPS lub localhost, " +
                    "aby uzyskać dostęp do lokalizacji.",
                    "error"
                );
                return;
            }

            if (watchId !== null) {
                return;
            }

            setStatus(
                "Oczekiwanie na lokalizację. Zaakceptuj prośbę " +
                "przeglądarki o dostęp do położenia..."
            );

            startButton.disabled = true;
            stopButton.disabled = false;

            watchId = navigator.geolocation.watchPosition(
                showPosition,
                function (error) {
                    showError(error);

                    if (error.code === 1) {
                        stopTracking(false);
                    }
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 20000
                }
            );
        }

        function stopTracking(showMessage = true) {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            startButton.disabled = false;
            stopButton.disabled = true;

            if (showMessage) {
                setStatus("Śledzenie lokalizacji zostało zatrzymane.");
            }
        }

        startButton.addEventListener("click", startTracking);
        stopButton.addEventListener("click", () => stopTracking());

        window.addEventListener("pagehide", () => {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
        });
    </script>
</body>
</html>
